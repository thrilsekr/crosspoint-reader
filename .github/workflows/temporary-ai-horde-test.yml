name: Temporary AI Horde Image Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-ai-horde-image-test
  cancel-in-progress: false

jobs:
  generate:
    name: Generate one private SDXL portrait
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate image with AI Horde
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from PIL import Image

          BASE = "https://aihorde.net/api/v2"
          KEY = os.environ.get("AI_HORDE_API_KEY", "").strip()
          if not KEY:
              raise SystemExit("AI_HORDE_API_KEY is missing. Check the repository Actions secret.")

          HEADERS = {
              "apikey": KEY,
              "Client-Agent": "Xteink-AIHorde-Standalone-Test:1.0:thrilsekr",
              "Content-Type": "application/json",
          }

          def api(method, path, body=None, authenticated=True):
              headers = dict(HEADERS if authenticated else {
                  "Client-Agent": "Xteink-AIHorde-Standalone-Test:1.0:thrilsekr"
              })
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = Request(BASE + path, data=data, headers=headers, method=method)
              try:
                  with urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:1200]
                  raise RuntimeError(f"AI Horde API returned HTTP {exc.code}: {detail}") from exc

          out = Path("horde-output")
          out.mkdir(exist_ok=True)

          # Validate the credential without printing it or the complete response.
          user = api("GET", "/find_user")
          print("AI Horde authentication: OK")
          print("Account:", user.get("username", "authenticated user"))
          if "kudos" in user:
              print("Available kudos:", user["kudos"])

          # Select active SDXL-family models from the live Horde list.
          active = api("GET", "/status/models", authenticated=False)
          if isinstance(active, dict):
              active = active.get("models", [])
          if not isinstance(active, list):
              raise RuntimeError("Unexpected response from AI Horde active-model endpoint.")

          candidates = []
          for item in active:
              if not isinstance(item, dict):
                  continue
              name = str(item.get("name", ""))
              baseline = str(item.get("baseline", "")).lower()
              count = item.get("count", 0)
              is_sdxl = ("xl" in baseline) or ("sdxl" in name.lower())
              if is_sdxl and isinstance(count, (int, float)) and count > 0:
                  candidates.append(item)

          if not candidates:
              raise RuntimeError("No active SDXL-family model with available workers was found.")

          candidates.sort(key=lambda item: (item.get("eta", 10**9), -item.get("count", 0)))
          models = [item["name"] for item in candidates]
          print("Active SDXL models with workers:", ", ".join(models[:12]))
          print("Using the live SDXL model pool; AI Horde will assign an available worker.")

          prompt = (
              "Portrait-oriented atmospheric fantasy illustration for an e-reader screensaver: "
              "a lone traveler in a weathered cloak standing on an ancient stone path above a "
              "mist-filled valley, distant ruined towers and layered mountains, a few tiny warm "
              "window lights, overcast dawn, elegant painterly detail, restrained natural palette, "
              "strong readable silhouette, carefully composed vertical scene, no text, no lettering"
              "### blurry, low quality, watermark, logo, text, lettering, cropped subject, "
              "extra limbs, malformed hands, oversaturated colors"
          )

          payload = {
              "prompt": prompt,
              "params": {
                  "width": 448,
                  "height": 832,
                  "steps": 25,
                  "cfg_scale": 7.5,
                  "sampler_name": "k_euler",
                  "n": 1,
                  "seed": "-1",
                  "karras": False,
                  "hires_fix": False,
                  "clip_skip": 1
              },
              "nsfw": False,
              "censor_nsfw": True,
              "models": models,
              "shared": False,
              "r2": False,
              "replacement_filter": True
          }

          submitted = api("POST", "/generate/async", payload)
          request_id = submitted.get("id")
          if not request_id:
              raise RuntimeError("AI Horde did not return a generation request ID: " + json.dumps(submitted)[:1000])
          print("Generation accepted. Request ID:", request_id)
          print("Waiting for a volunteer worker (maximum 30 minutes)...")

          deadline = time.time() + 30 * 60
          last_status = None
          while time.time() < deadline:
              status = api("GET", f"/generate/check/{request_id}")
              waiting = status.get("waiting", 0)
              processing = status.get("processing", 0)
              done = status.get("done", 0)
              faulted = status.get("faulted", 0)
              state = (waiting, processing, done, faulted)
              if state != last_status:
                  print(f"Queue status: waiting={waiting}, processing={processing}, done={done}, faulted={faulted}")
                  last_status = state
              if done:
                  break
              if faulted and not waiting and not processing:
                  raise RuntimeError("AI Horde reported that the generation failed.")
              if status.get("is_possible") is False:
                  raise RuntimeError("AI Horde reports no available worker can fulfill this request.")
              time.sleep(15)
          else:
              raise TimeoutError("No completed image after 30 minutes. The request may still be queued.")

          result = api("GET", f"/generate/status/{request_id}")
          generations = result.get("generations") or []
          if not generations:
              raise RuntimeError("AI Horde marked the request done but returned no generations.")

          generation = generations[0]
          encoded = generation.get("img")
          if not encoded:
              raise RuntimeError("AI Horde status response did not contain image data.")
          image_bytes = base64.b64decode(encoded)
          source_path = out / "ai-horde-result.webp"
          source_path.write_bytes(image_bytes)

          with Image.open(source_path) as image:
              image.load()
              source_format = image.format
              width, height = image.size
              image.convert("RGB").save(out / "ai-horde-result.bmp", format="BMP")

          metadata = {
              "provider": "AI Horde",
              "request_id": request_id,
              "model_pool": models,
              "worker": generation.get("worker_name"),
              "seed": generation.get("seed"),
              "source_format": source_format,
              "width": width,
              "height": height,
              "bmp_created": True,
              "shared": False,
              "settings": {
                  "width": 448, "height": 832, "steps": 25,
                  "cfg_scale": 7.5, "sampler_name": "k_euler",
                  "batch_count": 1, "hires_fix": False
              }
          }
          (out / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print("Generation successful.")
          print(f"Image format: {source_format}; dimensions: {width}x{height}")
          print("Saved WebP and BMP outputs plus metadata.")
          PY

      - name: Upload generated image and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-horde-standalone-test
          path: horde-output/
          if-no-files-found: warn
          retention-days: 3
